# Gerado pelo matugen a partir do wallpaper.
# Fonte: ~/.config/matugen/templates/hermes/matugen.yaml (edite lá, não aqui).
name: matugen
description: Cores do wallpaper atual (Material You via matugen)

colors:
  background: "{{colors.surface.default.hex}}"
  ui_accent: "{{colors.primary.default.hex}}"
  banner_accent: "{{colors.primary.default.hex}}"
  ui_tool: "{{colors.tertiary.default.hex}}"
  ui_thinking: "{{colors.on_surface_variant.default.hex}}"
  banner_title: "{{colors.primary.default.hex}}"
  ui_primary: "{{colors.primary.default.hex}}"
  banner_text: "{{colors.on_surface.default.hex}}"
  ui_text: "{{colors.on_surface.default.hex}}"
  ui_label: "{{colors.on_surface.default.hex}}"
  banner_dim: "{{colors.on_surface_variant.default.hex}}"
  banner_border: "{{colors.outline_variant.default.hex}}"
  ui_border: "{{colors.outline_variant.default.hex}}"
  ui_ok: "#7fc98a"
  ui_warn: "#e8b85a"
  ui_error: "{{colors.error.default.hex}}"
  prompt: "{{colors.on_surface.default.hex}}"
  input_rule: "{{colors.primary.default.hex}}"
  response_border: "{{colors.secondary.default.hex}}"
  status_bar_bg: "{{colors.surface_container_low.default.hex}}"
  status_bar_text: "{{colors.on_surface.default.hex}}"
  status_bar_good: "#7fc98a"
  status_bar_warn: "#e8b85a"
  status_bar_bad: "{{colors.error.default.hex}}"
  status_bar_critical: "{{colors.error.default.hex}}"
  session_label: "{{colors.secondary.default.hex}}"
  session_border: "{{colors.outline_variant.default.hex}}"
  syntax_string: "{{colors.tertiary.default.hex}}"
  syntax_number: "{{colors.secondary.default.hex}}"
  syntax_keyword: "{{colors.primary.default.hex}}"
  syntax_comment: "{{colors.outline.default.hex}}"
  completion_menu_bg: "{{colors.surface_container.default.hex}}"
  completion_menu_current_bg: "{{colors.surface_container_highest.default.hex}}"
  completion_menu_meta_bg: "{{colors.surface_container_high.default.hex}}"
