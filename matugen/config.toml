[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/hyprland/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.feishin_dark_css]
input_path = '~/.config/matugen/templates/feishin/matugen-dark.css'
output_path = '~/.config/feishin/Themes/matugen-dark.css'

[templates.feishin_dark_json]
input_path = '~/.config/matugen/templates/feishin/matugen-dark.json'
output_path = '~/.config/feishin/Themes/matugen-dark.json'

[templates.feishin_light_css]
input_path = '~/.config/matugen/templates/feishin/matugen-light.css'
output_path = '~/.config/feishin/Themes/matugen-light.css'

[templates.feishin_light_json]
input_path = '~/.config/matugen/templates/feishin/matugen-light.json'
output_path = '~/.config/feishin/Themes/matugen-light.json'

[templates.spicetify]
input_path = '~/.config/matugen/templates/spicetify/color.ini'
output_path = '~/.config/spicetify/Themes/Matugen/color.ini'

[templates.hermes]
input_path = '~/.config/matugen/templates/hermes/matugen.yaml'
output_path = '~/.hermes/skins/matugen.yaml'

[templates.vesktop]
input_path = '~/.config/matugen/templates/vesktop/matugen.theme.css'
output_path = '~/.config/vesktop/themes/matugen.theme.css'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian/matugen.css'
output_path = '~/Documents/Obsidian/.obsidian/snippets/matugen.css'

[templates.vscodium_dark]
input_path = '~/.config/matugen/templates/vscodium/matugen-dark-color-theme.json'
output_path = '~/.vscode-oss/extensions/local.matugen-theme-1.0.0/themes/matugen-dark-color-theme.json'

[templates.vscodium_light]
input_path = '~/.config/matugen/templates/vscodium/matugen-light-color-theme.json'
output_path = '~/.vscode-oss/extensions/local.matugen-theme-1.0.0/themes/matugen-light-color-theme.json'
